# The pinned Linux v6.18 tree KDAL builds against: the private ELMOS SDK
# package (prebuilt Image) and the v6.18 source after modules_prepare.
# Used by the KUnit job and by the quality gate (sparse, Coccinelle).
# The calling job needs "packages: read".
name: kernel tree
description: Pull the pinned ELMOS SDK and prepare the v6.18 tree for out-of-tree modules
inputs:
  token:
    description: token with read access to the SDK package
    required: true
outputs:
  kdir:
    description: the prepared kernel tree
    value: ${{ steps.prepare.outputs.kdir }}
  image:
    description: the prebuilt kernel Image
    value: ${{ steps.prepare.outputs.image }}
runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@v2
    - name: Pull the pinned ELMOS SDK kernel (private package)
      shell: bash
      env:
        # pinned run tag: a new SDK build reaches KDAL only through a reviewed change
        SDK: ghcr.io/nguyentrongphuc552003/elmos-sdk:linux-6.18-4
        TOKEN: ${{ inputs.token }}
      run: |
        echo "$TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
        mkdir -p build/ci-kernel
        oras pull "$SDK" -o build/ci-kernel
        oras logout ghcr.io
        ls build/ci-kernel
        python3 -c 'import json;m=json.load(open("build/ci-kernel/manifest.json"));print("SDK", m["linux"]["version_string"], "elmos", m["elmos_commit"], "run", m["run"])'
    - name: Install kernel build tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          clang lld llvm make bc flex bison libelf-dev libssl-dev \
          python3 xz-utils curl qemu-system-arm device-tree-compiler
    - name: Prepare the pinned kernel (prebuilt Image, v6.18 source, modules_prepare)
      id: prepare
      shell: bash
      run: |
        set -o pipefail
        mkdir -p build
        scripts/ci/kernel-prepare.sh build/ci-kernel | tail -2 > build/kpaths
        cat build/kpaths
        echo "kdir=$(sed -n 1p build/kpaths)" >> "$GITHUB_OUTPUT"
        echo "image=$(sed -n 2p build/kpaths)" >> "$GITHUB_OUTPUT"
