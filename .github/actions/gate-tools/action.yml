# The quality gate's engine (haven, at the commit pinned in
# quality/gate.json) and the tool versions the profile pins, with the
# cppcheck build and the checkpatch files cached. Used by the "quality
# gate" job and the weekly deep checks.
name: gate tools
description: Fetch the pinned gate engine and install the pinned tools
runs:
  using: composite
  steps:
    - name: Install build tools
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=5 update -qq
        sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends cmake ninja-build pipx
    - name: Pinned cppcheck version (the cache key)
      id: pins
      shell: bash
      run: echo "cppcheck=$(python3 -c 'import json;print(json.load(open("quality/gate.json"))["versions"]["cppcheck"])')" >> "$GITHUB_OUTPUT"
    - name: Cached cppcheck build
      uses: actions/cache@v4
      with:
        path: ~/.cache/cppcheck-*
        key: cppcheck-${{ steps.pins.outputs.cppcheck }}
    - name: Cached checkpatch files (pinned by SHA-256)
      uses: actions/cache@v4
      with:
        path: ~/.local/share/haven-gate
        key: checkpatch-${{ hashFiles('quality/gate.json') }}
    - name: The gate's engine (haven, pinned commit) and its pinned tools
      shell: bash
      run: bash "$(scripts/gate engine-dir)/tools/gate/ci-setup.sh"
    - name: Tool versions
      shell: bash
      run: scripts/gate doctor
