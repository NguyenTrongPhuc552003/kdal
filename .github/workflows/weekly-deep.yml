# Weekly, and on demand: the quality gate's deep tier with the pinned kernel
# tree: Coccinelle (too slow for every pull request), sparse, the
# sanitizer build (with LeakSanitizer) and 120 s of libFuzzer on kdalc's
# lexer and parser. Not a required check; it fails when
# it finds something the baseline does not hold (BLOCKER, CRITICAL or
# MAJOR), so the run shows red and GitHub notifies the owner.
name: weekly deep checks

on:
  schedule:
    - cron: "17 2 * * 1" # Mondays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deep:
    name: deep tier (Coccinelle, sanitizers; fails on new findings)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The pinned kernel tree (for sparse and Coccinelle)
        id: kernel
        uses: ./.github/actions/kernel-tree
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: The gate's tools (haven's action at the engine pin)
        uses: NguyenTrongPhuc552003/haven/.github/actions/gate-tools@4d26a363d5e9779fc7bd2424982e6d99d6bf9a12
        with:
          # libFuzzer's runtime (clang only recommends it)
          packages: libclang-rt-18-dev
      - name: Deep tier (blocks nothing)
        env:
          KDAL_KDIR: ${{ steps.kernel.outputs.kdir }}
        run: scripts/gate deep --fail-on-new
