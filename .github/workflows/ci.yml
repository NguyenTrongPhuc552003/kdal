# GitHub Actions. The kernel module and KUnit run on Linux; the userspace
# tools and smoke tests also run on macOS.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: The pinned kernel tree (for sparse)
        id: kernel
        uses: ./.github/actions/kernel-tree
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: The gate's tools (haven's action at the engine pin)
        uses: NguyenTrongPhuc552003/haven/.github/actions/gate-tools@4d26a363d5e9779fc7bd2424982e6d99d6bf9a12
      - name: Quality gate (whole tree)
        env:
          KDAL_KDIR: ${{ steps.kernel.outputs.kdir }}
        run: scripts/gate ci

  build-and-smoke:
    name: build tools and the frozen compiler, smoke tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake ninja-build gcc device-tree-compiler
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja dtc
      - name: Smoke tests
        run: sh scripts/ci/test.sh
      - name: Build examples
        run: |
          cc -std=c99 -Wall -o /tmp/gpudemo examples/accel_demo/gpudemo.c
          cc -std=c99 -Wall -o /tmp/npudemo examples/accel_demo/npudemo.c

  kunit:
    name: kernel module build and KUnit in QEMU (Linux v6.18 arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: The pinned kernel tree
        id: kernel
        uses: ./.github/actions/kernel-tree
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build kdal.ko with KUnit and run it in QEMU
        run: scripts/ci/kunit-qemu.sh "${{ steps.kernel.outputs.kdir }}" "${{ steps.kernel.outputs.image }}" build/kunit
      - name: Show the console log on failure
        if: failure()
        run: tail -150 build/kunit/console.log || true
