# GitHub Actions. The kernel module and KUnit run on Linux; the userspace
# tools and smoke tests also run on macOS.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends cmake ninja-build pipx
      - name: Cached cppcheck build
        uses: actions/cache@v4
        with:
          path: ~/.cache/cppcheck-*
          key: cppcheck-${{ hashFiles('quality/gate.json') }}
      - name: The gate's engine (haven, pinned commit) and its pinned tools
        run: bash "$(scripts/gate engine-dir)/tools/gate/ci-setup.sh"
      - name: Tool versions
        run: scripts/gate doctor
      - name: Quality gate (whole tree)
        run: scripts/gate ci

  build-and-smoke:
    name: build tools and the frozen compiler, smoke tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake ninja-build gcc
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Smoke tests
        run: sh scripts/ci/test.sh
      - name: Build examples
        run: |
          cc -std=c99 -Wall -o /tmp/gpudemo examples/accel_demo/gpudemo.c
          cc -std=c99 -Wall -o /tmp/npudemo examples/accel_demo/npudemo.c

  kunit:
    name: kernel module build and KUnit in QEMU (Linux v6.18 arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: oras-project/setup-oras@v2
      - name: Pull the pinned ELMOS SDK kernel (private package)
        env:
          # pinned run tag: a new SDK build reaches KDAL only through a reviewed change
          SDK: ghcr.io/nguyentrongphuc552003/elmos-sdk:linux-6.18-4
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          mkdir -p build/ci-kernel
          oras pull "$SDK" -o build/ci-kernel
          oras logout ghcr.io
          ls build/ci-kernel
          python3 -c 'import json;m=json.load(open("build/ci-kernel/manifest.json"));print("SDK", m["linux"]["version_string"], "elmos", m["elmos_commit"], "run", m["run"])'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            clang lld llvm make bc flex bison libelf-dev libssl-dev \
            python3 xz-utils curl qemu-system-arm device-tree-compiler
      - name: Prepare the pinned kernel (prebuilt Image, v6.18 source, modules_prepare)
        run: |
          set -o pipefail
          mkdir -p build
          scripts/ci/kernel-prepare.sh build/ci-kernel | tail -2 > build/kpaths
          cat build/kpaths
      - name: Build kdal.ko with KUnit and run it in QEMU
        run: scripts/ci/kunit-qemu.sh "$(sed -n 1p build/kpaths)" "$(sed -n 2p build/kpaths)" build/kunit
      - name: Show the console log on failure
        if: failure()
        run: tail -150 build/kunit/console.log || true
