# Codeberg CI (Forgejo Actions). Limits: codeberg-small 2 CPU / 5 min, amd64.
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    name: build tools, compiler and smoke tests
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake ninja-build gcc
      - name: Smoke tests
        run: sh scripts/ci/test.sh
      - name: Build examples
        run: |
          cc -std=c99 -Wall -o /tmp/gpudemo examples/accel_demo/gpudemo.c
          cc -std=c99 -Wall -o /tmp/npudemo examples/accel_demo/npudemo.c

  lint:
    name: style and static analysis
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cppcheck shellcheck
      - name: Kernel style check
        run: sh scripts/ci/checkpatch.sh
      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
            --suppress=missingIncludeSystem --suppress=missingInclude \
            --suppress=unusedStructMember --suppress=constParameter \
            --suppress=constVariablePointer --suppress=constParameterPointer \
            --suppress=constParameterCallback --suppress=variableScope \
            --suppress=unknownMacro -I include -I compiler/include \
            --error-exitcode=1 \
            src/backends/generic/ src/backends/qemu/ src/core/ src/drivers/example/ \
            tools/kdality/ compiler/ tests/userspace/ tests/integration/ examples/
      - name: shellcheck (warnings reported, not fatal)
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning || true
